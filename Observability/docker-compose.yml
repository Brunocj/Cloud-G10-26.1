services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - pucp_cloud_net
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.listen-address=:9090"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  observability:
    build: .
    container_name: observability
    ports:
      - "8006:8000"
    networks:
      - pucp_cloud_net
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./config/targets.yml:/app/config/targets.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Prometheus — dentro de la misma red Docker
      - PROMETHEUS_URL=http://prometheus:9090

      # MySQL — en el host
      - DB_HOST=host.docker.internal
      - DB_USER=mandarina
      - DB_PASSWORD=sandia
      - DB_NAME=cloud

      # Sliding window
      - WINDOW_DAYS=15
      - OC_UPDATE_INTERVAL=300

      # OC safety factors
      - K_CPU=1.0
      - K_RAM=2.0
      - OC_CPU_DEFAULT=2.0
      - OC_RAM_DEFAULT=1.54
      - OC_RAM_MAX=10.0
      - OC_CPU_MAX=20.0

      # VM activation threshold
      - VM_ACTIVATION_HOURS=36

      # Dashboard
      - ENABLE_DASHBOARD=true

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ───────────────────────────────────────────────────────────────────────────
  # Loki — almacén e índice de logs. Uso interno (sin puerto al host).
  # El acceso desde la WebApp pasa por el API Gateway (solo superAdmin).
  # ───────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    networks:
      - pucp_cloud_net
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    # MULTI-HOST: para que otros hosts empujen a este Loki, publica el puerto:
    # ports:
    #   - "3100:3100"

  # ───────────────────────────────────────────────────────────────────────────
  # Alloy — recolector. Descubre y lee los logs de TODOS los contenedores del
  # host vía el socket de Docker. NO toca ni recrea ningún contenedor.
  # En multi-host, corre UNA instancia de Alloy por host.
  # ───────────────────────────────────────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.11.0
    container_name: alloy
    user: root                         # necesario para leer /var/run/docker.sock
    networks:
      - pucp_cloud_net
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    # UI de diagnóstico de Alloy (opcional, solo para depurar el pipeline):
    # ports:
    #   - "12345:12345"

volumes:
  prometheus_data:
  loki_data:
  alloy_data:

networks:
  pucp_cloud_net:
    external: true
