services:
  api-gateway:
    build: .
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SLICE_MANAGER_URL: http://slice-manager:8000
      FORWARD_TIMEOUT:   30.0
      LOG_LEVEL:         INFO
      # ── JWT (desactivado — activar cuando Keycloak esté listo) ──
      JWT_ENABLED:       "false"
      JWT_JWKS_URL:      ""
      JWT_ISSUER:        ""
      JWT_AUDIENCE:      ""
      # ── VNC SSH Tunnel ──────────────────────────────────────────
      VNC_SSH_KEY_PATH:  /app/keys/id_ed25519
      VNC_SSH_USER:      ubuntu
    ports:
      - "8085:8080"
    volumes:
      # Claves SSH para el túnel VNC a través del gateway
      - ../SliceManager/keys:/app/keys:ro
    networks:
      - pucp_cloud_net

networks:
  pucp_cloud_net:
    external: true
