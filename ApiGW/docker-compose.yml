services:
  api-gateway:
    build: .
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SLICE_MANAGER_URL: http://slice-manager:8000
      FORWARD_TIMEOUT:   30.0
      LOG_LEVEL:         INFO
      # ── JWT — Keycloak ──────────────────────────────────────────
      # JWT_JWKS_URL: usa nombre de servicio Docker (red interna)
      # JWT_ISSUER:   debe coincidir con KC_HOSTNAME_URL de Keycloak
      JWT_ENABLED:       "true"
      JWT_JWKS_URL:      "http://keycloak:8080/realms/pucp-cloud/protocol/openid-connect/certs"
      JWT_ISSUER:        "http://10.20.11.212:8086/realms/pucp-cloud"
      JWT_AUDIENCE:      ""
      # ── VNC SSH Tunnel ──────────────────────────────────────────
      VNC_SSH_KEY_PATH:  /app/keys/id_ed25519
      VNC_SSH_USER:      ubuntu
    ports:
      - "8085:8080"
    networks:
      - pucp_cloud_net

networks:
  pucp_cloud_net:
    external: true
