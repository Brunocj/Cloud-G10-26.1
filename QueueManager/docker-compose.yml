services:

  queue-manager:
    build: .
    container_name: queue-manager
    restart: unless-stopped
    environment:
      NATS_URL:        nats://nats:4222
      COMPUTE_TIMEOUT: 300
      LOG_LEVEL:       INFO
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - pucp_cloud_net

  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # clientes
      - "8222:8222"   # monitoring HTTP
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pucp_cloud_net

networks:
  pucp_cloud_net:
    external: true