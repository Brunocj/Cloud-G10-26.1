version: '3.8'

services:
  network-orchestrator:
    build: .
    container_name: network-orchestrator
    restart: unless-stopped
    environment:
      NATS_URL:        nats://nats:4222
      LOG_LEVEL:       INFO
      SSH_TIMEOUT: "60"
      # ── OpenStack (Neutron — redes, puertos, security groups) ──
      OS_AUTH_URL:              "http://192.168.202.1:5000/v3"
      OS_USERNAME:              cloud_admin
      OS_PASSWORD:              "66c5f106f03328bbb47bd5ec609c320e"
      OS_PROJECT_NAME:          cloud_admin
      OS_USER_DOMAIN_NAME:      Cloud
      OS_PROJECT_DOMAIN_NAME:   Cloud
      OS_IDENTITY_API_VERSION:  "3"
      # Nombre REAL de la red externa en Neutron (`openstack network list --external`).
      # OJO: aquí decía OPENSTACK_EXTERNAL_NETWORK="ext-net", variable que NINGÚN
      # módulo lee — la que manda es OS_EXTERNAL_NETWORK_NAME (app/core/config.py).
      OS_EXTERNAL_NETWORK_NAME: "external"
      OS_EXTERNAL_SUBNET_NAME:  "external_subnet"
      # Banda que Neutron autoasigna (puertos qg- de los routers). El resto del
      # /24 queda para la tabla `ip_pool` del SliceManager. Deben ser disjuntos.
      OS_EXTERNAL_ALLOCATION_POOL: "10.60.16.2-10.60.16.99"
      # DNS entregado a las VMs vía config-drive (la subnet va sin DHCP)
      OS_SUBNET_DNS_NAMESERVERS: "8.8.8.8,8.8.4.4"
      # 1496 = 1500 − 4 del tag 802.1Q sobre el trunk ens4. Subir a 1500 solo si
      # antes se sube el trunk a 1504 en TODOS los computes y el nodo de red.
      OS_NETWORK_MTU:           "1496"
      OPENSTACK_AZ_ID:          "2"
      # ── SOCKS5 Proxy para OpenStack ──
      HTTP_PROXY:               "socks5h://openstack-proxy:1080"
      HTTPS_PROXY:              "socks5h://openstack-proxy:1080"
      NO_PROXY:                 "localhost,127.0.0.1,nats,vm-placement,db,10.20.11.212,host.docker.internal"
    ports:
      - "8084:8084"
    networks:
      - pucp_cloud_net

networks:
  pucp_cloud_net:
    external: true