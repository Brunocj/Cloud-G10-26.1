version: '3.8'

services:
  network-orchestrator:
    build: .
    container_name: network-orchestrator
    restart: unless-stopped
    environment:
      NATS_URL:        nats://nats:4222
      LOG_LEVEL:       DEBUG
    ports:
      - "8084:8084"
    networks:
      - pucp_cloud_net

networks:
  pucp_cloud_net:
    external: true