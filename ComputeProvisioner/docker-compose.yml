version: "3.9"

services:

  compute-provisioner:
    build: .
    container_name: compute-provisioner
    restart: unless-stopped
    environment:
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # SSH hacia workers (ajustar IPs según tu entorno)
      SSH_USER:     root
      SSH_KEY_PATH: /root/.ssh/id_rsa

      # Rutas en los workers
      IMAGES_BASE_DIR: /images
      VMS_BASE_DIR:    /vms

      # Logging
      LOG_LEVEL: INFO

    volumes:
      # Montar la clave SSH privada del controlador
      - ~/.ssh/id_rsa:/root/.ssh/id_rsa:ro

    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"   # healthcheck

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
