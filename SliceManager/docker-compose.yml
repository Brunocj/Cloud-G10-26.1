services:
  slice-manager:
    build: .
    container_name: slice-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:                   
      - "host.docker.internal:host-gateway"
    environment:
      - NATS_URL=nats://nats:4222
      - VM_PLACEMENT_URL=http://vm-placement:8080/placement
      - PROMETHEUS_URL=http://10.20.11.212:9090
      - DB_HOST=10.20.11.212
      - DB_USER=mandarina
      - DB_PASSWORD=sandia
      - DB_NAME=cloud
      - GC_INTERVAL_HOURS=6
      - IMAGES_DIR=/mnt/cloud_images
      # ── OpenStack (Glance — catálogo de imágenes) ──
      - OS_AUTH_URL=http://192.168.202.1:5000/v3
      - OS_USERNAME=cloud_admin
      - OS_PASSWORD=66c5f106f03328bbb47bd5ec609c320e
      - OS_PROJECT_NAME=cloud_admin
      - OS_USER_DOMAIN_NAME=Cloud
      - OS_PROJECT_DOMAIN_NAME=Cloud
      - OS_IDENTITY_API_VERSION=3
      - OS_IMAGE_API_VERSION=2
      - OPENSTACK_AZ_ID=2
      # ── SOCKS5 Proxy para OpenStack ──
      - HTTP_PROXY=socks5h://openstack-proxy:1080
      - HTTPS_PROXY=socks5h://openstack-proxy:1080
      - NO_PROXY=localhost,127.0.0.1,nats,vm-placement,db,10.20.11.212,host.docker.internal
      #KEYCLOAK - CREDENCIALES
      - KEYCLOAK_URL:http://keycloak:8080
      - KEYCLOAK_REALM:pucp-cloud
      - KEYCLOAK_ADMIN_USER:admin
      - KEYCLOAK_ADMIN_PASS:admin123           # ⚠️ cambiar en producción
      - KEYCLOAK_ADMIN_CLIENT:admin-cli
    volumes:
      # Monta la carpeta local ./keys en la ruta /app/keys dentro del contenedor
      # El ":ro" significa Read-Only (Solo lectura por seguridad)
      - ./keys:/app/keys:ro
      - /mnt/cloud_images:/mnt/cloud_images
    networks:
      - pucp_cloud_net

  openstack-proxy:
    image: alpine
    container_name: openstack-proxy
    restart: unless-stopped
    volumes:
      - ./keys:/app/keys:ro
    command: >
      sh -c "apk add --no-cache openssh-client dos2unix &&
             mkdir -p ~/.ssh &&
             cp /app/keys/id_ed25519 ~/.ssh/id_ed25519 &&
             dos2unix ~/.ssh/id_ed25519 &&
             chmod 600 ~/.ssh/id_ed25519 &&
             ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -N -D 0.0.0.0:1080 ubuntu@10.20.11.119 -p 5821"
    networks:
      - pucp_cloud_net
networks:
  pucp_cloud_net:
    external: true
